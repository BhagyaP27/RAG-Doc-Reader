name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt
      - run: pip install pytest ruff

      # Lint because ruff is fast and catches real issues
      - name: Lint backend
        run: ruff check backend/

      # Type check l for catching rag.py bugs early
      - run: pip install pyright
      - name: Type check
        run: pyright backend/
        continue-on-error: true  # don't block PRs while you add types

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # Vite build — catches JSX errors, missing imports
      - name: Build frontend
        run: npm run build
        working-directory: frontend